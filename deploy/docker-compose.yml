services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  rate-limiter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v0.1.0
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - SHUTDOWN_TIMEOUT=5s
      - READ_TIMEOUT=5s
      - READ_HEADER_TIMEOUT=2s
      - WRITE_TIMEOUT=10s
      - IDLE_TIMEOUT=120s
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      - REDIS_DIAL_TIMEOUT=5s
      - REDIS_READ_TIMEOUT=3s
      - REDIS_WRITE_TIMEOUT=3s
    depends_on:
      - redis
    restart: unless-stopped
