services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  rate-limiter-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v0.1.0
    environment:
      - SERVER_PORT=8080
      - ENV=development
      - SHUTDOWN_TIMEOUT=5s
      - READ_TIMEOUT=5s
      - READ_HEADER_TIMEOUT=2s
      - WRITE_TIMEOUT=10s
      - IDLE_TIMEOUT=120s
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      - REDIS_DIAL_TIMEOUT=5s
      - REDIS_READ_TIMEOUT=3s
      - REDIS_WRITE_TIMEOUT=3s
    depends_on:
      - redis
    restart: unless-stopped

  rate-limiter-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v0.1.0
    environment:
      - SERVER_PORT=8080
      - ENV=development
      - SHUTDOWN_TIMEOUT=5s
      - READ_TIMEOUT=5s
      - READ_HEADER_TIMEOUT=2s
      - WRITE_TIMEOUT=10s
      - IDLE_TIMEOUT=120s
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      - REDIS_DIAL_TIMEOUT=5s
      - REDIS_READ_TIMEOUT=3s
      - REDIS_WRITE_TIMEOUT=3s
    depends_on:
      - redis
    restart: unless-stopped

  rate-limiter-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: v0.1.0
    environment:
      - SERVER_PORT=8080
      - ENV=development
      - SHUTDOWN_TIMEOUT=5s
      - READ_TIMEOUT=5s
      - READ_HEADER_TIMEOUT=2s
      - WRITE_TIMEOUT=10s
      - IDLE_TIMEOUT=120s
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      - REDIS_DIAL_TIMEOUT=5s
      - REDIS_READ_TIMEOUT=3s
      - REDIS_WRITE_TIMEOUT=3s
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - rate-limiter-1
      - rate-limiter-2
      - rate-limiter-3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - rate-limiter-1
      - rate-limiter-2
      - rate-limiter-3
    restart: unless-stopped
