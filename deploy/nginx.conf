events {
    worker_connections 1024;
}

http {
    upstream rate_limiters {
        server rate-limiter-1:8080;
        server rate-limiter-2:8080;
        server rate-limiter-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiters;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject response header identifying the handling backend
            add_header X-Handled-By $upstream_addr always;
        }
    }
}
